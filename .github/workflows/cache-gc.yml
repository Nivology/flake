---
name: "Cache GC"
run-name: "${{ github.workflow }} (#${{ github.run_number }}-${{ github.run_attempt }})"

on:
  schedule:
  - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Plan only; do not repack, touch, or delete anything."
        required: false
        type: boolean

permissions: {}

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  gc:
    name: "Clear Actions cache"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: write # needed for REST cache deletes

    steps:
    - name: "Install Nix"
      uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

    - name: "Set up Hestia"
      uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0

    - name: "Run garbage collection"
      env:
        DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        GITHUB_TOKEN: ${{ github.token }}
      run: ${HESTIA_BIN} gc ${DRY_RUN:+"${DRY_RUN}"}
