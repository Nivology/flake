---
name: "Cache GC"
run-name: "${{ github.workflow }} (#${{ github.run_number }}-${{ github.run_attempt }})"

on:
  schedule:
  - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Plan only; do not repack, touch, or delete anything."
        required: false
        type: boolean

permissions: {}

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  gc:
    name: "Clear Actions cache"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: write

    steps:
    - name: "Install Nix"
      uses: cachix/install-nix-action@v31.11.5

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0

    - name: "Run garbage collection"
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: ${HESTIA_BIN} gc ${{ inputs.dry-run && '--dry-run' || '' }}
