---
name: "Build Outputs"
run-name: "${{ github.workflow }}: ${{ github.ref_name }} (#${{ github.run_number }}-${{ github.run_attempt }})"

on:
  merge_group:
  workflow_dispatch:
    inputs:
      FORCE:
        description: "Force build all outputs"
        type: boolean
        required: true
        default: true

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  checks:
    name: "Checks"
    uses: $/.github/workflows/checks.yml
    with:
      FORCE: ${{ inputs.FORCE || false }}
    permissions:
      pull-requests: read

  eval:
    name: "Evaluate required rebuilds"
    if: needs.checks.outputs.flake == 'true'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      hosts: ${{ steps.hosts.outputs.matrix || '[]' }}
      derivations: ${{ steps.derivations.outputs.matrix || '[]' }}

    steps:
    - name: "Checkout repository"
      id: checkout
      background: true
      uses: actions/checkout@v7.0.1

    - name: "Get secrets"
      id: secrets
      background: true
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        secrets: |
          ec6c99d6-ceb6-4954-b487-b4e50156014e > NIVOLOGY_SECRETS_RO

    - name: "Wait for checkout"
      wait: checkout

    - name: "Filter paths"
      if: ${{ !inputs.FORCE }}
      id: filter
      background: true
      uses: dorny/paths-filter@v4.0.3
      with:
        filters: |
          rebuild: &rebuild
          - '.tack/**'
          - 'overlays/**'
          - 'flake.nix'

          packages: &packages
          - *rebuild
          - 'pkgs/**'

          devShells:
          - *rebuild
          - 'shell.nix'

          hosts:
          - *rebuild
          - *packages
          - 'hosts/**'
          - 'modules/**'
          - 'users/**'

    - name: "Wait for secrets"
      wait: secrets

    - name: "Install Nix"
      id: nix
      background: true
      uses: cachix/install-nix-action@v31.11.3
      with:
        github_access_token: ${{ env.NIVOLOGY_SECRETS_RO }}

    - name: "Wait for filters"
      wait: filter

    - name: "Derivations matrix"
      id: derivations
      env:
        FILTERS: ${{ toJSON(steps.filter.outputs) }}
        FORCE: ${{ inputs.FORCE || false }}
      run: |
        MATRIX=$(jq --null-input --compact-output \
          --argjson filters "${FILTERS}" --argjson force "${FORCE}" '
          [ ("x86_64-linux", "aarch64-linux") as $system
          | ("devShells", "packages") as $output
          | select($force or $filters[$output] == "true")
          | {$output, $system} ]
        ')

        echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

    - name: "Wait for Nix"
      wait: nix

    - name: "Set up Hestia"
      if: steps.filter.outputs.hosts == 'true' || inputs.FORCE
      uses: Mic92/hestia@v3.1.0
      with:
        filter-drv-closures: true
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Hosts matrix"
      if: steps.filter.outputs.hosts == 'true' || inputs.FORCE
      id: hosts
      working-directory: ./ci
      run: |
        MATRIX=$(nix eval --json --file matrix.nix)
        jq -r ".[].drvPath" <<< "${MATRIX}" | xargs "${HESTIA_BIN}" hook --socket "${HESTIA_SOCKET}"
        echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  hosts:
    name: "${{ matrix.name }} (${{ matrix.system }})"
    if: needs.eval.outputs.hosts != '[]'
    needs:
    - checks
    - eval
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.eval.outputs.hosts) }}

    steps:
    - name: "Get secrets"
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        secrets: |
          ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN
          ec6c99d6-ceb6-4954-b487-b4e50156014e > NIVOLOGY_SECRETS_RO

    - name: "Install Nix"
      uses: cachix/install-nix-action@v31.11.3
      with:
        github_access_token: ${{ env.NIVOLOGY_SECRETS_RO }}
        extra_nix_config: |
          keep-going = true
          cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Set up Cachix"
      uses: cachix/cachix-action@v17
      continue-on-error: true
      with:
        name: misterkartoffel
        authToken: ${{ env.CACHIX_AUTH_TOKEN }}

    - name: "Prefetch derivation closure"
      env:
        DRV_PATH: ${{ matrix.drvPath }}
      run: ${HESTIA_BIN} prefetch "${DRV_PATH}"

    - name: "Build"
      env:
        DRV_PATH: ${{ matrix.drvPath }}
      run: >
        nix build "${DRV_PATH}^*"
        --no-link --print-build-logs

  derivations:
    name: "${{ matrix.output }} (${{ matrix.system }})"
    if: needs.eval.outputs.derivations != '[]'
    needs:
    - checks
    - eval
    runs-on: >-
      ${{ matrix.system == 'x86_64-linux' && 'ubuntu-latest'
      || matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' }}
    timeout-minutes: 30

    permissions:
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.eval.outputs.derivations) }}

    steps:
    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Get secrets"
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN

    - name: "Install Nix"
      uses: cachix/install-nix-action@v31.11.3
      with:
        extra_nix_config: |
          keep-going = true
          cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Build"
      run: >
        nix run nixpkgs#nix-fast-build --
        --skip-cached --push-build-closure
        --cachix-cache misterkartoffel
        --flake .#${{ matrix.output }}.${{ matrix.system }}

  sentinel:
    name: "Gate required checks"
    needs:
    - checks
    - eval
    - hosts
    - derivations
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1

    steps:
    - name: "Check upstream results"
      if: >-
        contains(needs.*.result, 'failure') ||
        contains(needs.*.result, 'cancelled')
      run: exit 1
