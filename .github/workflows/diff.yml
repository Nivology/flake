---
name: "Diff"

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      drvPath:
        required: true
        type: string
      runner:
        required: true
        type: string
    secrets:
      BWS_ACCESS_TOKEN:
        required: true

permissions: {}

jobs:
  old:
    name: "Build old closure"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    permissions:
      actions: read

    steps:
    - name: "Get secrets"
      uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        secrets: |
          ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN
          ec6c99d6-ceb6-4954-b487-b4e50156014e > NIVOLOGY_SECRETS_RO

    - name: "Install Nix"
      uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      with:
        github_access_token: ${{ env.NIVOLOGY_SECRETS_RO }}
        extra_nix_config: cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
      with:
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Set up Cachix"
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: misterkartoffel
        authToken: ${{ env.CACHIX_AUTH_TOKEN }}

    - name: "Prefetch derivation closure"
      env:
        DRV_PATH: ${{ inputs.drvPath }}
      run: ${HESTIA_BIN} prefetch "${DRV_PATH}"

    - name: "Build closure"
      id: build
      env:
        DRV_PATH: ${{ inputs.drvPath }}
      run: >
        CLOSURE=$(nix build
        "${DRV_PATH}^*"
        --no-link --print-out-paths)

        echo "closure=${CLOSURE}" >> "${GITHUB_OUTPUT}"

    - name: "Generate snapshot"
      env:
        CLOSURE: ${{ steps.build.outputs.closure }}
      run: nix run nixpkgs#dix -- snapshot "${CLOSURE}" > "old.json"

    - name: "Upload snapshot"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: snapshot-${{ inputs.name }}-old
        path: old.json

  new:
    name: "Build new closure"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    permissions:
      actions: read

    steps:
    - name: "Checkout repository"
      id: checkout
      background: true
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: "Get secrets"
      uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        secrets: |
          ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN
          ec6c99d6-ceb6-4954-b487-b4e50156014e > NIVOLOGY_SECRETS_RO

    - name: "Install Nix"
      uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      with:
        github_access_token: ${{ env.NIVOLOGY_SECRETS_RO }}
        extra_nix_config: cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
      with:
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Set up Cachix"
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: misterkartoffel
        authToken: ${{ env.CACHIX_AUTH_TOKEN }}

    - name: "Wait for checkout"
      wait: checkout

    - name: "Download changes"
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: tack
        path: .tack

    - name: "Build closure"
      id: build
      env:
        NAME: ${{ inputs.name }}
      run: >
        CLOSURE=$(nix build
        ".#nixosConfigurations.${NAME}.config.system.build.toplevel"
        --no-link --print-out-paths)

        echo "closure=${CLOSURE}" >> "${GITHUB_OUTPUT}"

    - name: "Generate snapshot"
      env:
        CLOSURE: ${{ steps.build.outputs.closure }}
      run: nix run nixpkgs#dix -- snapshot "${CLOSURE}" > "new.json"

    - name: "Upload snapshot"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: snapshot-${{ inputs.name }}-new
        path: new.json

  diff:
    name: "Generate diff"
    runs-on: ${{ inputs.runner }}
    needs:
    - old
    - new
    timeout-minutes: 5

    steps:
    - parallel:
      - name: "Checkout CI"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            ci

      - name: "Install Nix"
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: cores = 0

    - name: "Download snapshots"
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: snapshot-${{ inputs.name }}-*
        path: ci
        merge-multiple: true

    - name: "Generate diff"
      id: generate
      working-directory: ./ci
      run: nix run nixpkgs#dix -- diff --output json {old,new}.json > "diff.json"

    - name: "Parse diff"
      id: parse
      working-directory: ./ci
      env:
        NAME: ${{ inputs.name }}
      run: nix eval --raw --file diff.nix > "${NAME}.svg"

    - name: "Upload diff JSON"
      if: always() && (steps.generate.outcome == 'failure' || steps.parse.outcome == 'failure')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: failure-${{ inputs.name }}
        path: ci/diff.json

    - name: "Upload diff SVG"
      if: steps.parse.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: diff-${{ inputs.name }}
        path: ci/${{ inputs.name }}.svg
